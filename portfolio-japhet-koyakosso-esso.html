<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Japhet Koyakosso-Esso — Développement, Data &amp; IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F1420;
    --panel:#161F30;
    --panel-2:#1D2740;
    --line:#2A3550;
    --text:#EDEFF3;
    --muted:#93A0B8;
    --amber:#E8A33D;
    --teal:#5FD0A6;
    --radius:10px;
}
*{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    line-height:1.55;
    overflow-x:hidden;
  }
  ::selection{background:var(--amber); color:#1A1200;}
  a{color:inherit;}
  .wrap{max-width:1040px; margin:0 auto; padding:0 28px;}
  h1,h2,h3{font-family:'Fraunces', serif; font-weight:600; letter-spacing:-0.01em;}
 
  #netbg{position:fixed; inset:0; z-index:0; opacity:0.55; pointer-events:none;}
  #spotlight{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:radial-gradient(560px circle at var(--x,50%) var(--y,20%), rgba(232,163,61,0.10), transparent 62%);
    transition:background .05s linear;
  }
